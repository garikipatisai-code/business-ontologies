openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  status:
                    type: string
  /orders/{orderId}/refund:
    post:
      summary: Submit a refund for an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Refund submitted
